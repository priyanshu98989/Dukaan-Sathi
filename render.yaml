# Render Blueprint for Dukaan Sathi — API only.
#
# The React SPA is deployed separately, to Vercel, so this service does one job:
# the JSON API and its connection to MongoDB. That split is worth it because the
# API has to sit still between calls (see the rate-limit note below) while the
# SPA is served from a CDN with no cold start at all.
#
# The API is still CORS-locked to wherever the SPA lives, via CLIENT_ORIGIN.
#
# The database is MongoDB Atlas M0, not something on Render. That is a cost
# decision, not an oversight: Render has no free tier for private services, and a
# free web service cannot attach a persistent disk. So a MongoDB on Render is
# either paid ($7/mo, plus the disk) or free and ephemeral - in which case every
# restart and redeploy silently resets the shop's stock to the five-item seed.
# Atlas M0 is 512 MB, free forever, and actually keeps the data.
#
# Two things Atlas makes you do that a private network would not have:
#   1. Network Access has to allow 0.0.0.0/0. The free Render plan has no fixed
#      outbound IP, so a narrow allowlist means the service cannot reach the
#      database at all. What actually protects the data is a random Atlas password
#      scoped to this one database, plus this app's own API key in front of it.
#   2. The connection string has to be pasted in by hand, below.

services:
  - type: web
    name: dukaan-sathi-api
    runtime: node
    plan: free
    region: singapore

    # Server dependencies only. The client is not built here, so `npm start`
    # finds no client/dist and serves the API alone - which is the point.
    buildCommand: npm --prefix server install
    startCommand: npm --prefix server start

    # Hits MongoDB, so an unreachable database fails the deploy instead of
    # shipping an API that 500s on the first call.
    healthCheckPath: /api/health

    envVars:
      # Required, filled in at deploy time. Server-side only, never in the bundle.
      - key: GEMINI_API_KEY
        sync: false

      # MongoDB Atlas SRV string, from the cluster's Connect dialog:
      #   mongodb+srv://<user>:<password>@<cluster>.mongodb.net/dukaan_sathi
      - key: MONGODB_URI
        sync: false

      # The Vercel origin, e.g. https://dukaan-sathi.vercel.app. Required now that
      # the SPA is cross-origin: without it the browser blocks every call. Comma-
      # separated if you later add a second frontend host.
      - key: CLIENT_ORIGIN
        sync: false

      # The shop key. Generated once by Render and read off the dashboard; the
      # shopkeeper types it into the app on first load.
      - key: API_KEY
        generateValue: true

      # Enables HSTS and the production security headers.
      - key: NODE_ENV
        value: production

      - key: SHOP_NAME
        value: Sharma General Store

      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite

      - key: CONFIDENCE_THRESHOLD
        value: "0.75"

      # Every voice command is one billable Gemini call, so this budget is what
      # caps what a misbehaving client can spend. Held at 10 because Gemini's own
      # free tier allows roughly 15 requests per minute: setting this higher just
      # moves the 429 from our limiter to theirs, and the shopkeeper sees a less
      # helpful message. Raise it if you enable billing.
      - key: RATE_LIMIT_VOICE_MAX
        value: "10"

      - key: RATE_LIMIT_READ_MAX
        value: "120"

      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"

      - key: MAX_AUDIO_BYTES
        value: "10485760"
