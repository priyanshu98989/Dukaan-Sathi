# Render Blueprint for Dukaan Sathi.
#
# Two services, both on Render, nothing else to sign up for:
#
#   dukaan-sathi        web service  - Express API + the built React SPA
#   dukaan-sathi-mongo  private      - MongoDB 8, unreachable from the internet
#
# One web service runs both halves of the app: Express serves `client/dist` when
# it exists, so the browser talks to a single origin and there is no CORS
# allowlist to keep in sync.
#
# The MongoDB is a *private* service, which is what removes MongoDB Atlas from the
# picture. It gets no onrender.com subdomain and no public IP; the only way in is
# over Render's private network from the web service, same workspace and region.
# No IP allowlist to widen, no database password to leak.

services:
  # ---------------------------------------------------------------------------
  # The app.
  # ---------------------------------------------------------------------------
  - type: web
    name: dukaan-sathi
    runtime: node
    # Free is enough for the app: it may *send* private network traffic to a paid
    # service, so it can still reach the database. The trade is the free tier's
    # 15-minute idle sleep, which costs ~30s on the first voice command after a
    # gap. Change to `plan: starter` when that starts mattering.
    plan: free
    # Private networking only works inside one region. The database below must
    # match this.
    region: singapore

    # `install:all` covers root + server + client. The client build has to happen
    # before start, or the server boots with no client and answers only /api.
    buildCommand: npm run install:all && npm run build
    startCommand: npm start

    # Hits MongoDB, so a database that is unreachable fails the deploy instead of
    # shipping an app that 500s on the first page load.
    healthCheckPath: /api/health

    envVars:
      # Render resolves the database's internal hostname - which carries a suffix
      # you cannot predict - and injects it here. config/env.js assembles the
      # connection string from this, so there is nothing to paste by hand.
      - key: MONGODB_HOST
        fromService:
          name: dukaan-sathi-mongo
          type: pserv
          property: host
      - key: MONGODB_PORT
        value: "27017"
      - key: MONGODB_DB
        value: dukaan_sathi

      # Required, filled in at deploy time. Server-side only, never in the bundle.
      - key: GEMINI_API_KEY
        sync: false

      # The shop key. Generated once by Render and read off the dashboard; the
      # shopkeeper types it into the app on first load.
      - key: API_KEY
        generateValue: true

      # Enables HSTS and the production security headers.
      - key: NODE_ENV
        value: production

      # Only matters for cross-origin calls, and the SPA is served by this same
      # process, so leaving it unset still works. Set it if you later split the
      # client onto its own host.
      - key: CLIENT_ORIGIN
        sync: false

      - key: SHOP_NAME
        value: Sharma General Store

      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest

      - key: CONFIDENCE_THRESHOLD
        value: "0.75"

      # Every voice command is one billable Gemini call, so this budget is what
      # caps what a misbehaving client can spend.
      - key: RATE_LIMIT_VOICE_MAX
        value: "20"

      - key: RATE_LIMIT_READ_MAX
        value: "120"

      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"

      - key: MAX_AUDIO_BYTES
        value: "10485760"

  # ---------------------------------------------------------------------------
  # MongoDB.
  #
  # `plan` cannot be `free` here: persistent disks are a paid-plan feature, and
  # without a disk the database would be wiped on every restart and redeploy -
  # which for an inventory app means the shop's stock silently resets to the
  # 5-item seed. The cheapest private service is `0.5c-512mb`.
  #
  # `region` must match the web service above or the private network will not
  # route between them.
  # ---------------------------------------------------------------------------
  - type: pserv
    name: dukaan-sathi-mongo
    runtime: docker
    dockerfilePath: ./infra/mongo/Dockerfile
    plan: 0.5c-512mb
    region: singapore

    disk:
      name: mongo-data
      # The official image's declared data directory. A disk mounted anywhere
      # else starts a mongod with an empty data directory and writes nothing.
      mountPath: /data/db
      sizeGB: 1
